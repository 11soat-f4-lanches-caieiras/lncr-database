name: Deploy Food Item Database

env:
  TERRAFORM_VERSION: 1.5.7

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Food Item RDS
    runs-on: codebuild-github-lncr-database-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}

    - name: Terraform Init
      run: terraform init
      working-directory: modules/rds-postgresql-food-item

    - name: Terraform Plan
      run: terraform plan -var-file="../../prd.tfvars"
      working-directory: modules/rds-postgresql-food-item

    - name: Terraform Apply
      run: terraform apply -var-file="../../prd.tfvars" -auto-approve
      working-directory: modules/rds-postgresql-food-item